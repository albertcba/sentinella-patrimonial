name: sentinella

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  run-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Validar fitxers JSON
        run: |
          python - << 'EOF'
          import json, sys
          fitxers = ["actius.json", "fundamentals.json", "sensibilitat_macro.json"]
          for fitxer in fitxers:
              try:
                  with open(fitxer) as f:
                      json.load(f)
                  print(f"✔ {fitxer} vàlid")
              except Exception as e:
                  print(f"❌ ERROR: {fitxer} no és vàlid\n{e}")
                  sys.exit(1)
          EOF

      - name: Executar sentinella i generar fitxers
        run: |
          # Assegurem que existeix la carpeta abans d'executar el script
          mkdir -p docs
          
          # Generem l'alerta (el script també modificarà docs/calendar_history.jsonl)
          python sentinella.py | tail -n 1 > alerta.json
          
          echo "JSON generat:"
          cat alerta.json
          
          # Copiem l'alerta al dashboard directament en el mateix entorn
          cp alerta.json docs/data.json

      - name: Commit & Push dels canvis (Dashboard i Històric)
        run: |
          git config user.name "Sentinella Bot"
          git config user.email "bot@github.com"
          
          # Afegim tots els fitxers de la carpeta docs modificats/creats
          git add docs/
          
          # Fem el commit només si hi ha canvis reals
          git diff-index --quiet HEAD || git commit -m "Actualització automàtica Sentinella [skip ci]"
          
          git push

      - name: Verificar històric
        run: |
          ls -lah docs/
          tail -5 docs/calendar_history.jsonl || true
